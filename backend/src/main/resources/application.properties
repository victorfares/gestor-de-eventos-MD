spring.datasource.url=jdbc:postgresql://localhost:5432/gestor_eventos_md
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update

# Exibição e formatação de logs SQL no console para debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Administrador criado na primeira inicialização. Em produção, defina as variáveis de ambiente.
app.admin.nome=${ADMIN_NOME:Admin Meninas Digitais}
app.admin.email=${ADMIN_EMAIL:admin@meninasdigitais.utfpr.edu.br}
app.admin.senha=${ADMIN_SENHA:admin123}

# Chave HS256 para assinar os tokens de login (mínimo de 32 caracteres). Em produção, defina JWT_SECRET.
app.jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-gestor-eventos-md-trocar-em-producao}
app.jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:8}

# Endereços do frontend autorizados a chamar a API, separados por vírgula.
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}