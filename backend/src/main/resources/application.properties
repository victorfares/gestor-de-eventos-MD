server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestor_eventos_md}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.idle-timeout=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Administrador criado na primeira inicialização. Em produção, defina as variáveis de ambiente.
app.admin.nome=${ADMIN_NOME:Admin Meninas Digitais}
app.admin.email=${ADMIN_EMAIL:victorfarescorrea@gmail.com}
app.admin.senha=${ADMIN_SENHA:victor123}

# Chave HS256 para assinar os tokens de login (mínimo de 32 caracteres). Em produção, defina JWT_SECRET.
app.jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-gestor-eventos-md-trocar-em-producao}
app.jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:8}

# Endereços do frontend autorizados a chamar a API, separados por vírgula.
app.cors.origens=${CORS_ORIGENS:http://localhost:5173}
